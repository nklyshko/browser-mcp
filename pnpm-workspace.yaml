packages:
  - 'app/*'
  - 'packages/*'
allowBuilds:
  # better-sqlite3 v13+ ships N-API prebuilt binaries and has no install scripts;
  # source builds (binding.gyp) are unnecessary.
  better-sqlite3: false
  esbuild: true
  protobufjs: true
  sharp: true
  spawn-sync: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@ethanwilkins/chrome-mcp-shared-2026@1.4.0'
  - vite@8.3.0
  - '@ethanwilkins/typescript-native@7.0.3'
overrides:
  hono: ^4.13.7
  # The lockfile's 6.11.6 exists only on public npm, not in the Artifactory mirror,
  # so installs fail the release-age check. onnx-proto wants ^6.8.8 and 6.11.5 is
  # the newest the mirror carries. Drop this once the mirror syncs 6.11.6.
  protobufjs: 6.11.5
  rollup-plugin-dts: ^6.5.1
